# Het antwoord wordt berekend uit de seed. seed = 0 geeft bij elke bouw een willekeurig profiel en wachtwoord.
type = "generated"

[opties]
taal = "nl"
# 0 = willekeurig; een ander getal geeft altijd hetzelfde profiel
seed = 0
# Aantal dingen in het wachtwoord
lengte = 4
# Aantal dingen in het profiel (de rest zijn afleiders)
aantal = 8
# Aantal rijen (gokken) op het blad, hoogstens 10
pogingen = 6

[meta]
auteur = "UHCTF"
formaat = "booth"
leeftijd = "8–12"
duur = "10 min"
vlag_formaat = "antwoord"

[nl]
naam = "Wachtwoord-mastermind"
onderwerp = "Veilige wachtwoorden, logisch redeneren"
materiaal = "geprint profiel (`profiel.pdf`) en gokkenlijst (`deelnemer.pdf`), 1 van elk per team van 2 à 3; potlood, liefst ook kleurpotloden; de begeleider controleert de gokken"
beschrijving = '''
Veel mensen maken een wachtwoord van dingen die iedereen op hun profiel kan lezen. Kun jij het wachtwoord raden?

Het wachtwoord bestaat uit een paar dingen van het profiel, in een bepaalde volgorde. Doe een gok en de begeleider zegt per vak of het juist is, fout, of juist maar op de verkeerde plaats. Net als bij Mastermind, maar met profielgegevens in plaats van kleuren.
'''
hints = [
  "Alle delen van het wachtwoord staan in het profiel.",
  "Begin met een gok en gebruik de feedback: wat staat goed, wat niet?",
  "Een letter die fout is, zit niet in het wachtwoord. Die kun je uitsluiten.",
]
opzet = '''
Print per team (2 à 3 kinderen) `profiel.pdf` (het profiel van het verzonnen kind) en `deelnemer.pdf` (de gokkenlijst). De begeleider heeft `begeleider.pdf` met het juiste wachtwoord en controleert elke gok per letter: juist, fout of juist maar op de verkeerde plaats. De kinderen markeren dat zelf in het vak: vinkje, kruisje of pijltje, of ze kleuren het in. Een blad heeft 6 gokken (optie `pogingen`); met logisch redeneren lukt het meestal in 3 à 5.

Als de gok niet lukt, speel dan eerst een voorbeeld hardop mee. Bespreek na afloop waarom een wachtwoord dat uit je profiel te halen is, niet veilig is. Standaard (`seed = 0`) krijg je bij elke bouw een willekeurig profiel en wachtwoord. De gebruikte seed staat in `begeleider.pdf`; geef hem mee om hetzelfde spel opnieuw te bouwen. Een vaste `seed` geeft altijd hetzelfde profiel.
'''
