type = "generated"
antwoord = "salad"

[opties]
taal = "nl"
verschuiving = 3
# false: geen verwijzing naar de decoder/spiekbrief (alles op papier)
met_decoder = true
# ja: bouw ook een digitale versie (digitaal.html) met een caesarwiel op het scherm
digitaal = false
# korte, gewone woorden met dezelfde verschuiving, op het blad om de verschuiving te vinden; [] = geen
oefenwoorden = []
# hint bij de oefenwoorden, bv. "Veel voorkomende huisdieren"; leeg = geen
oefenhint = ""

[meta]
auteur = "UHCTF"
formaat = "booth"
leeftijd = "8–12"
duur = "5–10 min"
vlag_formaat = "antwoord"

[nl]
naam = "Romeinse geheimen"
onderwerp = "Caesarcijfer (ROT-N)"
materiaal = "geprint bericht (`deelnemer.pdf`), potlood; optioneel een laptop of tablet met de [decoder](../_gedeeld/decoder/) en de [spiekbrief](../_gedeeld/spiekbrief/)"
beschrijving = '''
Een archeoloog vond een bericht dat lijkt te zijn gecodeerd door een keizer.

Het bericht: `PXIXA`
'''
hints = [
  "Welke keizer gebruikte een geheimschrift waarbij je letters verschuift?",
  "Het is een Caesarcijfer: elke letter is een vast aantal plaatsen verschoven.",
  "Probeer het met kleine getallen: verschuif 1, 2, 3 plaatsen.",
]
opzet = '''
Deelnemers gebruiken de strook op `deelnemer.pdf`, of de meegeleverde [decoder](../_gedeeld/decoder/) (lokaal in de browser, geen internet nodig). De [spiekbrief](../_gedeeld/spiekbrief/) kan er bij geprint worden. Zet `met_decoder = false` voor een versie volledig op papier. `verschuiving` is het aantal letters. Met `oefenwoorden` (bv. `["kat", "hond"]`) en een `oefenhint` (bv. "Veel voorkomende huisdieren") komen er korte, makkelijk te raden woorden op het blad met dezelfde verschuiving: raad ze en je vindt de verschuiving, om daarna het moeilijkere bericht te ontcijferen. Het bericht staat ook in `bericht.txt`. Met `digitaal = true` komt er ook een versie bij voor op een laptop (`digitaal.html`): een caesarwiel dat de kinderen draaien tot de oefenwoorden gewone woorden worden, waarna ze het bericht lezen. De verschuiving staat niet in de pagina zelf.
'''
