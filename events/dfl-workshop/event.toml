# Instellingen en uitdagingen voor dit event. [laptop] bevat de instellingen van de laptopmap; elke andere tabel is een uitdaging.
# Sleutels in een uitdaging overschrijven de standaardwaarden. De standaardantwoorden staan publiek in de repo: daarom eigen antwoorden.
# digitaal = true bouwt er ook een versie bij voor op de laptop (in out/laptop/).

# Laptopmap: ./jr event build dfl-workshop maakt events/dfl-workshop/out/laptop/
# Kopieer die map naar de laptop en open index.html in Chrome. Er is geen internet of server nodig.
[laptop]
titel = "DFL-workshop: kraak de kluis"
# Er zijn 13 sloten (webvlaggen telt 3 keer). De kluis gaat open na 10 sloten: de laatste drie opdrachten (hack-het-portaal, luister-naar-de-stilte
# en hash-kraker) zijn extra voor teams die snel klaar zijn. Elk open slot telt mee, ook als een team een andere opdracht liet liggen.
nodig = 10
intro = "Welkom, ethische hackers. Los puzzels op, onderzoek bestanden en lees broncode. Typ elk antwoord in de kluis: pas als {nodig} van de {totaal} sloten open zijn, gaat de kluis open. Extra opdrachten voor de snelle teams: de laatste drie."

# intro (zonder slot): iedereen zoekt de anderen met dezelfde kleur; zo ontstaan twee ploegen, Cyaan en Magenta, die tegen elkaar strijden
[kies-je-kant]
aantal = 16

# opwarmer: Caesarcijfer met het caesarwiel op het scherm (antwoord eigen keuze: de standaard staat publiek in de repo)
[romeinse-geheimen]
digitaal = true
antwoord = "firewall"
met_decoder = true
oefenwoorden = ["kat", "hond", "vis", "hamster"]
oefenhint = "Veel voorkomende huisdieren"

# opwarmer: vier lagen, de laatste is ROT13
[laag-na-laag]
digitaal = true
antwoord = "defense-in-depth"
lagen = ["rot13", "binair", "hex", "base64"]

# kleurkanalen bewerken: Alleen blauw + Inverteren
[robot-qr]
digitaal = true
antwoord = "zero-trust"
kleur = "#000028"

# inspect element: paginabron, ontwikkelaarstools en bestanden die een site laadt
[webvlaggen]

# phishing herkennen: rode vlaggen aanvinken, de letters van de nepberichten spellen het antwoord
[phishing-of-echt]
digitaal = true
antwoord = "nepmail"

# logica: schrap verdachten met de verklaringen van de getuigen
[wie-is-de-hacker]
digitaal = true
seed = 4817
verdachten = 8
minimum = 6

# logica: raad het wachtwoord uit het profiel met de feedback per vak
[wachtwoord-mastermind]
digitaal = true
seed = 7351
lengte = 5
aantal = 8

# forensics met de bestandsinspecteur
[verborgen-bestanden]
digitaal = true
antwoord = "extensies-liegen"

# extra: webbeveiliging 2: een nep-portaal hacken (Elementen, URL, token). Het antwoord heeft minstens 3 woorden
[hack-het-portaal]
antwoord = "controleer-alles-op-de-server"

# extra: een WAV waarin morse zit, zichtbaar in het spectrogram van de WAV-decoder; de leerlingen lezen en decoderen het zelf
[luister-naar-de-stilte]
digitaal = true
antwoord = "stilte-spreekt"

# extra: hashes kraken: een woord met een jaartal, de beheerder gebruikt een zout (het woord moet in woorden.txt staan)
[hash-kraker]
digitaal = true
antwoord = "gitaar2019"

# station aan een aparte tafel, zonder vlag
[lockpicking]
